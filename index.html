<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Rincón de Hermes | ControlAR</title>
  </head>
  <body>
    <script>
      // Aplica el tema guardado antes de dibujar la página, para que no parpadee.
      try {
        if (localStorage.getItem("controlar-tema") === "oscuro") {
          document.body.classList.add("oscuro");
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
